[project]
name = "mashup"
version = "0.1.0"
description = "Turn a creator-owned video/podcast archive into coherent themed mashups using only existing clips."
authors = [{ name = "Sarthak Agrawal", email = "sarthakagrawal927@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.1.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
# Local subtitle generation for archives that ship without SRT/VTT.
# Apple-silicon only; the rest of the pipeline never imports these.
transcribe = ["mlx-whisper>=0.4.2"]

[project.scripts]
mashup = "mashup.cli:app"

[build-system]
requires = ["uv_build>=0.5.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "mashup"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
