schema: spec-driven

context: |
  Tech stack: Python 3.11+ (uv, typer, pydantic, httpx, numpy), FFmpeg,
  SQLite, Astro + a React island for the editor.
  Model access goes through the fleet free-ai gateway (OpenAI-compatible);
  this repo holds no provider keys.
  Domain: assembling themed mashups from a single creator's own archive,
  using only clips that already exist. No generated dialogue or footage.
  The project is a validation experiment before it is a product: the
  question is whether structure-aware sequencing beats semantic retrieval.
